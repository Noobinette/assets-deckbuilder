<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dos Pixel of Glory — 20 variantes</title>
<style>
  :root { background:#12141c; color:#f3e6c4; font-family:Georgia, serif; }
  body { max-width:1400px; margin:32px auto; padding:0 20px; }
  h1 { font-weight:normal; letter-spacing:.04em; }
  p { color:#cbb98a; max-width:72ch; line-height:1.45; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-top:24px; }
  figure { margin:0; background:#0e0b08; border:1px solid #3d4a7a; border-radius:8px; overflow:hidden; }
  img { width:100%; height:auto; display:block; }
  figcaption { padding:8px 10px 12px; font-size:13px; color:#e8d5a0; }
  .planches img { width:100%; max-width:920px; border:1px solid #3d4a7a; border-radius:8px; margin:8px 0 18px; }
</style>
</head>
<body>
  <h1>Dos « Pixel of Glory » — 20 variantes</h1>
  <p>Titre du jeu en bleu / rouge ancien, comme les logos. Format 750×1050.</p>
  <div class="planches">
    <img src="planche.jpg" alt="Planche des 20 dos titre">
  </div>
  <div class="grid">
      <figure>
        <img src="01_navy_laurier.png" alt="Navy et laurier">
        <figcaption>01. Navy et laurier</figcaption>
      </figure>

      <figure>
        <img src="02_cramoisi.png" alt="Cramoisi">
        <figcaption>02. Cramoisi</figcaption>
      </figure>

      <figure>
        <img src="03_split_bleu_rouge.png" alt="Bleu / rouge">
        <figcaption>03. Bleu / rouge</figcaption>
      </figure>

      <figure>
        <img src="04_parchemin.png" alt="Parchemin">
        <figcaption>04. Parchemin</figcaption>
      </figure>

      <figure>
        <img src="05_velours_nuit.png" alt="Velours nuit">
        <figcaption>05. Velours nuit</figcaption>
      </figure>

      <figure>
        <img src="06_blason.png" alt="Blason">
        <figcaption>06. Blason</figcaption>
      </figure>

      <figure>
        <img src="07_bois_peint.png" alt="Bois peint">
        <figcaption>07. Bois peint</figcaption>
      </figure>

      <figure>
        <img src="08_nuit_entrelacs.png" alt="Nuit et entrelacs">
        <figcaption>08. Nuit et entrelacs</figcaption>
      </figure>

      <figure>
        <img src="09_vitrail.png" alt="Vitrail">
        <figcaption>09. Vitrail</figcaption>
      </figure>

      <figure>
        <img src="10_banniere.png" alt="Bannière">
        <figcaption>10. Bannière</figcaption>
      </figure>

      <figure>
        <img src="11_ivoire.png" alt="Ivoire enluminé">
        <figcaption>11. Ivoire enluminé</figcaption>
      </figure>

      <figure>
        <img src="12_metal.png" alt="Plaque métal">
        <figcaption>12. Plaque métal</figcaption>
      </figure>

      <figure>
        <img src="13_ciel_nuit.png" alt="Ciel étoilé">
        <figcaption>13. Ciel étoilé</figcaption>
      </figure>

      <figure>
        <img src="14_entrelacs.png" alt="Entrelacs">
        <figcaption>14. Entrelacs</figcaption>
      </figure>

      <figure>
        <img src="15_emeraude.png" alt="Émeraude">
        <figcaption>15. Émeraude</figcaption>
      </figure>

      <figure>
        <img src="16_pourpre.png" alt="Pourpre">
        <figcaption>16. Pourpre</figcaption>
      </figure>

      <figure>
        <img src="17_sceau.png" alt="Sceau">
        <figcaption>17. Sceau</figcaption>
      </figure>

      <figure>
        <img src="18_mosaique.png" alt="Mosaïque">
        <figcaption>18. Mosaïque</figcaption>
      </figure>

      <figure>
        <img src="19_double_tranche.png" alt="Double tranche">
        <figcaption>19. Double tranche</figcaption>
      </figure>

      <figure>
        <img src="20_simple_etoile.png" alt="Titre simple">
        <figcaption>20. Titre simple</figcaption>
      </figure>
  </div>
</body>
</html>
