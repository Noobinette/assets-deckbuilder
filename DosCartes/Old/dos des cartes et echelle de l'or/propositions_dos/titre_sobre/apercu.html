<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dos Pixel of Glory — 20 variantes sobres</title>
<style>
  :root { background:#12141c; color:#f3e6c4; font-family:Georgia, serif; }
  body { max-width:1400px; margin:32px auto; padding:0 20px; }
  h1 { font-weight:normal; letter-spacing:.04em; }
  p { color:#cbb98a; max-width:72ch; line-height:1.45; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-top:24px; }
  figure { margin:0; background:#0e0b08; border:1px solid #5a4520; border-radius:8px; overflow:hidden; }
  img { width:100%; height:auto; display:block; }
  figcaption { padding:8px 10px 12px; font-size:13px; color:#e8d5a0; }
  .planches img { width:100%; max-width:920px; border:1px solid #5a4520; border-radius:8px; margin:8px 0 18px; }
</style>
</head>
<body>
  <h1>Dos « Pixel of Glory » — 20 variantes sobres</h1>
  <p>Titre plus discret, police pixel, sans gantelets ni volutes.
  Fonds brun, parchemin clair, bois peint et pourpre. Format 750×1050.</p>
  <div class="planches">
    <img src="planche.jpg" alt="Planche des 20 dos sobres">
  </div>
  <div class="grid">
      <figure>
        <img src="01_brun_or_laurier.png" alt="Brun, or, laurier">
        <figcaption>01. Brun, or, laurier</figcaption>
      </figure>

      <figure>
        <img src="02_brun_or_seul.png" alt="Brun, titre or">
        <figcaption>02. Brun, titre or</figcaption>
      </figure>

      <figure>
        <img src="03_brun_bleu_rouge.png" alt="Brun, bleu/rouge">
        <figcaption>03. Brun, bleu/rouge</figcaption>
      </figure>

      <figure>
        <img src="04_parchemin_or.png" alt="Parchemin or">
        <figcaption>04. Parchemin or</figcaption>
      </figure>

      <figure>
        <img src="05_parchemin_bleu_rouge.png" alt="Parchemin couleur">
        <figcaption>05. Parchemin couleur</figcaption>
      </figure>

      <figure>
        <img src="06_parchemin_laurier.png" alt="Parchemin, laurier">
        <figcaption>06. Parchemin, laurier</figcaption>
      </figure>

      <figure>
        <img src="07_bois_or.png" alt="Bois, titre or">
        <figcaption>07. Bois, titre or</figcaption>
      </figure>

      <figure>
        <img src="08_bois_bleu_rouge.png" alt="Bois, bleu/rouge">
        <figcaption>08. Bois, bleu/rouge</figcaption>
      </figure>

      <figure>
        <img src="09_pourpre_or_laurier.png" alt="Pourpre, laurier">
        <figcaption>09. Pourpre, laurier</figcaption>
      </figure>

      <figure>
        <img src="10_pourpre_or_seul.png" alt="Pourpre, titre or">
        <figcaption>10. Pourpre, titre or</figcaption>
      </figure>

      <figure>
        <img src="11_pourpre_bleu_rouge.png" alt="Pourpre, bleu/or">
        <figcaption>11. Pourpre, bleu/or</figcaption>
      </figure>

      <figure>
        <img src="12_brun_losange.png" alt="Brun, losange">
        <figcaption>12. Brun, losange</figcaption>
      </figure>

      <figure>
        <img src="13_ivoire_or.png" alt="Ivoire, titre or">
        <figcaption>13. Ivoire, titre or</figcaption>
      </figure>

      <figure>
        <img src="14_bois_laurier.png" alt="Bois, laurier">
        <figcaption>14. Bois, laurier</figcaption>
      </figure>

      <figure>
        <img src="15_prune_or.png" alt="Prune, titre or">
        <figcaption>15. Prune, titre or</figcaption>
      </figure>

      <figure>
        <img src="16_espresso_or.png" alt="Espresso, titre or">
        <figcaption>16. Espresso, titre or</figcaption>
      </figure>

      <figure>
        <img src="17_ivoire_bleu_laurier.png" alt="Ivoire, couleur">
        <figcaption>17. Ivoire, couleur</figcaption>
      </figure>

      <figure>
        <img src="18_pourpre_laurier_couleur.png" alt="Pourpre, couleur">
        <figcaption>18. Pourpre, couleur</figcaption>
      </figure>

      <figure>
        <img src="19_cuir_beige.png" alt="Cuir beige">
        <figcaption>19. Cuir beige</figcaption>
      </figure>

      <figure>
        <img src="20_chene_or.png" alt="Chêne, titre or">
        <figcaption>20. Chêne, titre or</figcaption>
      </figure>
  </div>
</body>
</html>
