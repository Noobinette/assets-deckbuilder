<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Best / alternative — 03 et échelle d'OR</title>
<style>
  :root { background:#12141c; color:#f3e6c4; font-family:Georgia, serif; }
  body { max-width:1400px; margin:32px auto; padding:0 20px; }
  h1, h2 { font-weight:normal; letter-spacing:.04em; }
  p { color:#cbb98a; max-width:78ch; line-height:1.45; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin:18px 0 36px; }
  figure { margin:0; background:#0e0b08; border:1px solid #5a4520; border-radius:8px; overflow:hidden; }
  img { width:100%; height:auto; display:block; }
  figcaption { padding:8px 10px 12px; font-size:13px; color:#e8d5a0; }
  a { color:#e8c36a; }
</style>
</head>
<body>
  <h1>Alternatives</h1>
  <p>
    Cinq dispositions du titre sur le dos 03 (brun, bleu, rouge), plus l’échelle d’OR
    avec des pièces un peu plus grosses. Format poker 750×1050.
    <a href="../apercu.html">Retour aux Best recadrés</a>.
  </p>
  <h2>03 brun bleu rouge — 5 titres</h2>
  <div class="grid">
    <figure>
      <img src="../03_brun_bleu_rouge.png" alt="03 originale recadrée">
      <figcaption>Origine (recadrée) — PIXEL OF / GLORY</figcaption>
    </figure>
    <figure>
      <img src="03a_pixel_ofglory.png" alt="03a">
      <figcaption>A. PIXEL / OF GLORY</figcaption>
    </figure>
    <figure>
      <img src="03b_pixelof_glory.png" alt="03b">
      <figcaption>B. PIXEL OF / GLORY</figcaption>
    </figure>
    <figure>
      <img src="03c_une_ligne.png" alt="03c">
      <figcaption>C. PIXEL OF GLORY (une ligne)</figcaption>
    </figure>
    <figure>
      <img src="03d_logo_laurier.png" alt="03d">
      <figcaption>D. Logo laurier (comme la 01) + titre</figcaption>
    </figure>
    <figure>
      <img src="03e_trois_lignes.png" alt="03e">
      <figcaption>E. PIXEL / OF / GLORY</figcaption>
    </figure>
  </div>
  <h2>Échelle d’OR — pièces plus lisibles</h2>
  <div class="grid">
    <figure>
      <img src="../original/02_donjon_enroule.png" alt="02 orig">
      <figcaption>02 originale</figcaption>
    </figure>
    <figure>
      <img src="02_donjon_enroule_pieces_grosses.png" alt="02 big">
      <figcaption>02 pièces plus grosses</figcaption>
    </figure>
  </div>
</body>
</html>
