<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Échelle de l'OR — propositions</title>
<style>
  :root { background:#1a1410; color:#f3e6c4; font-family:Georgia, serif; }
  body { max-width:1200px; margin:32px auto; padding:0 20px; }
  h1 { font-weight:normal; letter-spacing:.04em; }
  p { color:#cbb98a; max-width:70ch; line-height:1.45; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:22px; margin-top:28px; }
  figure { margin:0; background:#0e0b08; border:1px solid #5a4520; border-radius:8px; overflow:hidden; }
  img { width:100%; height:auto; display:block; }
  figcaption { padding:10px 12px 14px; font-size:14px; color:#e8d5a0; }
</style>
</head>
<body>
  <h1>Échelle de l'OR — 5 propositions</h1>
  <p>Piste unique 6 → 0 → 6. Les chiffres du côté adverse sont tournés de 180°,
  pour que chaque joueur lise les siens à l'endroit. On y déplace une pièce d'or.</p>
  <div class="grid">
      <figure>
        <img src="01_donjon_serpentin.png" alt="01_donjon_serpentin">
        <figcaption>Donjon — S fluide, fond fourni, pièces d’or</figcaption>
      </figure>

      <figure>
        <img src="02_donjon_manuscrit.png" alt="02_donjon_manuscrit">
        <figcaption>Donjon — S en créneau (croquis à la main)</figcaption>
      </figure>

      <figure>
        <img src="03_donjon_piste.png" alt="03_donjon_piste">
        <figcaption>Donjon — même fond, piste pierre/or un peu plus serrée</figcaption>
      </figure>

      <figure>
        <img src="04_salle_tresor.png" alt="04_salle_tresor">
        <figcaption>Salle du trésor — autre fond, même S fluide</figcaption>
      </figure>

      <figure>
        <img src="05_table_bois.png" alt="05_table_bois">
        <figcaption>Table de bois — cases parchemin, chiffres inversés</figcaption>
      </figure>
  </div>
</body>
</html>
