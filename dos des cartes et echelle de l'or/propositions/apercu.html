<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Échelle de l'OR — 6 propositions</title>
<style>
  :root { background:#1a1410; color:#f3e6c4; font-family:Georgia, serif; }
  body { max-width:1400px; margin:32px auto; padding:0 20px; }
  h1 { font-weight:normal; letter-spacing:.04em; }
  p { color:#cbb98a; max-width:72ch; line-height:1.45; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:22px; margin-top:28px; }
  figure { margin:0; background:#0e0b08; border:1px solid #5a4520; border-radius:8px; overflow:hidden; }
  img { width:100%; height:auto; display:block; }
  figcaption { padding:10px 12px 14px; font-size:14px; color:#e8d5a0; }
</style>
</head>
<body>
  <h1>Échelle de l'OR — 6 propositions</h1>
  <p>Pièces <strong>rondes</strong>, piste en <strong>serpentin</strong> (pas la grille carrée).
  Chiffres espacés à pas plus régulier. Côté adverse tourné de 180°.
  Deux cartes sur ton donjon, deux salles au trésor avec l’autre côté distinct,
  deux mines.</p>
  <p><img src="planche.jpg" alt="Planche des 6 propositions" style="width:100%;max-width:900px;border:1px solid #5a4520;border-radius:8px"></p>
  <div class="grid">
      <figure>
        <img src="01_donjon_serpentin.png" alt="01_donjon_serpentin">
        <figcaption>Donjon (ton fond) — S ouvert, pièces rondes, pas plus régulier</figcaption>
      </figure>

      <figure>
        <img src="02_donjon_enroule.png" alt="02_donjon_enroule">
        <figcaption>Donjon (ton fond) — S plus enroulé, virages plus ronds</figcaption>
      </figure>

      <figure>
        <img src="03_tresor_moitie.png" alt="03_tresor_moitie">
        <figcaption>Salle au trésor — bas = coffres, haut = porte, 0 sur le seuil</figcaption>
      </figure>

      <figure>
        <img src="04_tresor_cotes.png" alt="04_tresor_cotes">
        <figcaption>Salle au trésor de côté — coffres à gauche, escalier à droite</figcaption>
      </figure>

      <figure>
        <img src="05_mine_galerie.png" alt="05_mine_galerie">
        <figcaption>Mine d’or — galerie et wagonnet, S ouvert</figcaption>
      </figure>

      <figure>
        <img src="06_mine_filon.png" alt="06_mine_filon">
        <figcaption>Mine d’or — filons dans la roche, S un peu plus ample</figcaption>
      </figure>
  </div>
</body>
</html>
