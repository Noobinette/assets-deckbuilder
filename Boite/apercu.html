<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Boîte — Pixel of Glory</title>
<style>
  :root { background:#12141c; color:#f3e6c4; font-family:Georgia, serif; }
  body { max-width:1600px; margin:32px auto; padding:0 20px 64px; }
  h1, h2 { font-weight:normal; letter-spacing:.04em; }
  p { color:#cbb98a; max-width:80ch; line-height:1.45; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; margin:16px 0 36px; }
  figure { margin:0; background:#0e0b08; border:1px solid #5a4520; border-radius:8px; overflow:hidden; }
  img { width:100%; height:auto; display:block; }
  figcaption { padding:8px 10px 12px; font-size:13px; color:#e8d5a0; }
  code { font-size:11px; color:#bba56e; }
  .planche { max-width:100%; border:1px solid #5a4520; border-radius:8px; }
  .special { border-color:#c9a227; }
</style>
</head>
<body>
  <h1>Pixel of Glory — propositions de boîte</h1>
  <p>
    Série ciel : dix jaquettes autour des couchers de soleil et des ciels
    spéciaux (1728×2304, portrait 3:4). Deux visuels demandés :
    Griffon + Tour des Mystères, Oncle Dave + Frère Jean.
  </p>
  <p><img class="planche" src="planche.jpg" alt="Planche de la série ciel"></p>
  <h2>Série ciel (11–20)</h2>
  <div class="grid">
    <figure class="special">
      <img src="11_griffon_tour.jpg" alt="Griffon et la Tour des Mystères">
      <figcaption>11 — Griffon et Tour des Mystères<br><code>11_griffon_tour.jpg</code></figcaption>
    </figure>
    <figure class="special">
      <img src="12_dave_jean.jpg" alt="Oncle Dave et Frère Jean">
      <figcaption>12 — Oncle Dave et Frère Jean<br><code>12_dave_jean.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="13_mer_de_nuages.jpg" alt="Mer de nuages">
      <figcaption>13 — Mer de nuages<br><code>13_mer_de_nuages.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="14_lune_de_sang.jpg" alt="Lune de sang">
      <figcaption>14 — Lune de sang<br><code>14_lune_de_sang.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="15_aurore.jpg" alt="Aurore boréale">
      <figcaption>15 — Aurore boréale<br><code>15_aurore.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="16_lac_coucher.jpg" alt="Château sur le lac">
      <figcaption>16 — Lac au coucher de soleil<br><code>16_lac_coucher.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="17_rayons.jpg" alt="Rayons et arc-en-ciel">
      <figcaption>17 — Rayons et arc-en-ciel<br><code>17_rayons.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="18_voie_lactee.jpg" alt="Voie lactée">
      <figcaption>18 — Voie lactée<br><code>18_voie_lactee.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="19_elfe_crepuscule.jpg" alt="Elfe au crépuscule">
      <figcaption>19 — Elfe au crépuscule<br><code>19_elfe_crepuscule.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="20_ciel_violet.jpg" alt="Deux lunes">
      <figcaption>20 — Ciel violet, deux lunes<br><code>20_ciel_violet.jpg</code></figcaption>
    </figure>
  </div>
  <h2>Série précédente (conservée)</h2>
  <div class="grid">
    <figure>
      <img src="01_griffon.jpg" alt="Griffon au-dessus des montagnes">
      <figcaption>01 — Griffon emblématique<br><code>01_griffon.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="05_sombre_seigneur.jpg" alt="Le Sombre Seigneur">
      <figcaption>05 — Sombre Seigneur<br><code>05_sombre_seigneur.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="07_siege.jpg" alt="Siège de la forteresse">
      <figcaption>07 — Siège de la forteresse<br><code>07_siege.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="08_donjon.jpg" alt="Le donjon et le spectre">
      <figcaption>08 — Donjon<br><code>08_donjon.jpg</code></figcaption>
    </figure>
    <figure>
      <img src="10_dragon_argente.jpg" alt="Dragon argenté au sommet">
      <figcaption>10 — Dragon argenté<br><code>10_dragon_argente.jpg</code></figcaption>
    </figure>
  </div>
</body>
</html>
